name: Build Static Site
on:
  push:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build static export
        run: pnpm build
        env:
          # This repo was cut over from the isagog.com root to being an
          # archived backup at https://isagog.com/isagog-old/.
          NEXT_PUBLIC_BASE_PATH: /isagog-old

      - name: Generate timestamp
        id: ts
        run: echo "value=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      # Archive — keep a downloadable copy of every build
      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: isagog-site-${{ steps.ts.outputs.value }}
          path: out
          retention-days: 7

      # Pages artifact — consumed by the deploy job below
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # GitHub Pages deploy — master only
  # TODO: Deploy under another subpath like isagog.github.io for staging 
  #
  deploy:
    needs: build
    # if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

